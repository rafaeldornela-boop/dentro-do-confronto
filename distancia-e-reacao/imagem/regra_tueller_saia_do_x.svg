<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="100%" height="auto" style="background:#F8F9FA; border-radius:12px; border:1px solid #CBD5E1; font-family:system-ui, -apple-system, sans-serif;">
  
    <defs>
      <!-- Gradientes Institucionais PMMG -->
      <linearGradient id="grad-pmmg-teto" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="25%" stop-color="#F3EFE6" />
        <stop offset="50%" stop-color="#826C2B" />
        <stop offset="75%" stop-color="#F3EFE6" />
        <stop offset="100%" stop-color="#FFFFFF" />
      </linearGradient>

      <!-- Giroflex LED Estroboscópico com Brilho Suave -->
      <linearGradient id="giroflex-luz" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FF1A1A" />
        <stop offset="45%" stop-color="#FF5555" />
        <stop offset="50%" stop-color="#FFFFFF" />
        <stop offset="55%" stop-color="#3388FF" />
        <stop offset="100%" stop-color="#0055FF" />
      </linearGradient>

      <!-- Feixes de Varredura / Cones de Visão Táticos -->
      <radialGradient id="cone-visao-v1" cx="0%" cy="50%" r="100%">
        <stop offset="0%" stop-color="#187731" stop-opacity="0.45" />
        <stop offset="60%" stop-color="#187731" stop-opacity="0.15" />
        <stop offset="100%" stop-color="#187731" stop-opacity="0.0" />
      </radialGradient>

      <radialGradient id="cone-visao-v2" cx="0%" cy="50%" r="100%">
        <stop offset="0%" stop-color="#1995FF" stop-opacity="0.40" />
        <stop offset="60%" stop-color="#1995FF" stop-opacity="0.12" />
        <stop offset="100%" stop-color="#1995FF" stop-opacity="0.0" />
      </radialGradient>

      <radialGradient id="cone-alerta-vermelho" cx="0%" cy="50%" r="100%">
        <stop offset="0%" stop-color="#AB2328" stop-opacity="0.50" />
        <stop offset="70%" stop-color="#AB2328" stop-opacity="0.15" />
        <stop offset="100%" stop-color="#AB2328" stop-opacity="0.0" />
      </radialGradient>

      <!-- Filtros de Sombra Suave Realista (Drop Shadow) -->
      <filter id="sombra-veiculo" x="-15%" y="-15%" width="130%" height="130%">
        <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.22" />
      </filter>

      <filter id="sombra-operador" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.30" />
      </filter>

      <!-- Marcadores de Setas Táticas -->
      <marker id="seta-verde" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
        <path d="M0,0 L0,6 L7,3 z" fill="#187731" />
      </marker>
      <marker id="seta-vermelha" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
        <path d="M0,0 L0,6 L7,3 z" fill="#AB2328" />
      </marker>
      <marker id="seta-caqui" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
        <path d="M0,0 L0,6 L7,3 z" fill="#826C2B" />
      </marker>
      <marker id="seta-azul" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
        <path d="M0,0 L0,6 L7,3 z" fill="#1995FF" />
      </marker>
    </defs>
    

  <!-- Faixa de Cabeçalho Institucional PMMG -->
  <rect x="0" y="0" width="860" height="46" fill="#826C2B" />
  <text x="22" y="29" font-size="13" font-weight="900" fill="#FFFFFF" letter-spacing="1">POLÍCIA MILITAR DE MINAS GERAIS • DOUTRINA OPERACIONAL</text>
  <text x="838" y="29" font-size="11" font-weight="700" fill="#F3EFE6" text-anchor="end">MTP 01 / CTP — REGRA DOS 21 PÉS</text>

  <!-- Pista Operacional e Cenário Tático -->
  <rect x="18" y="60" width="824" height="395" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
  
  <!-- Linhas de Bordo e Pista Pontilhadas -->
  <line x1="18" y1="230" x2="842" y2="230" stroke="#F1F5F9" stroke-width="2" stroke-dasharray="8,8" />
  <line x1="18" y1="360" x2="842" y2="360" stroke="#F1F5F9" stroke-width="2" stroke-dasharray="8,8" />

  <!-- Viatura como Cobertura e Abrigo -->
  
    <g id="viatura-pmmg" transform="translate(600, 70) rotate(-35)" filter="url(#sombra-veiculo)">
      <!-- Chassi e Pneus sob os paralamas -->
      <rect x="22" y="-5" width="28" height="8" rx="2" fill="#1A1A1A" />
      <rect x="135" y="-5" width="28" height="8" rx="2" fill="#1A1A1A" />
      <rect x="22" y="77" width="28" height="8" rx="2" fill="#1A1A1A" />
      <rect x="135" y="77" width="28" height="8" rx="2" fill="#1A1A1A" />

      <!-- Carroceria Curva da SUV (Branco Perolizado PMMG) -->
      <path d="M 10,20 C 10,5 20,0 40,0 L 150,0 C 170,0 185,8 185,25 L 185,55 C 185,72 170,80 150,80 L 40,80 C 20,80 10,75 10,60 Z"
            fill="#FBFBFC" stroke="#826C2B" stroke-width="2.5" />

      <!-- Para-brisa Dianteiro Curvo Fumê -->
      <path d="M 50,8 C 45,8 42,12 40,40 C 42,68 45,72 50,72 L 62,68 C 58,55 58,25 62,12 Z"
            fill="#1E293B" opacity="0.88" />

      <!-- Teto da Viatura com Faixa Caqui/Preta Institucional -->
      <rect x="65" y="10" width="85" height="60" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <rect x="65" y="27" width="85" height="26" fill="#826C2B" />
      <text x="107" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PMMG</text>

      <!-- Vidro Traseiro -->
      <path d="M 152,14 L 160,18 C 163,30 163,50 160,62 L 152,66 Z" fill="#1E293B" opacity="0.85" />

      <!-- Vidros Laterais -->
      <rect x="68" y="4" width="78" height="4" rx="1" fill="#1E293B" opacity="0.75" />
      <rect x="68" y="72" width="78" height="4" rx="1" fill="#1E293B" opacity="0.75" />

      <!-- Barra de Giroflex Aerodinâmica LED -->
      <rect x="88" y="18" width="14" height="44" rx="3" fill="url(#giroflex-luz)" stroke="#334155" stroke-width="1.2" />

      <!-- Retrovisores Aerodinâmicos -->
      <path d="M 54,-4 L 60,0 L 50,2 Z" fill="#826C2B" />
      <path d="M 54,84 L 60,80 L 50,78 Z" fill="#826C2B" />

      <!-- Rótulo Identificador Tático -->
      <rect x="35" y="-28" width="115" height="20" rx="4" fill="#1E293B" opacity="0.9" />
      <text x="92" y="-14" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#E2E8F0" text-anchor="middle">VP PMMG — ANTEPARO / ABRIGO</text>
    </g>
    

  <!-- COTA MÉTRICA OFICIAL (6,4 METROS / 21 PÉS) -->
  <g id="cota-distancia">
    <line x1="170" y1="170" x2="570" y2="170" stroke="#826C2B" stroke-width="2" stroke-dasharray="6,4"
          marker-start="url(#seta-caqui)" marker-end="url(#seta-caqui)" />
    <!-- Marcador Central de Distância e Tempo -->
    <rect x="300" y="145" width="150" height="42" rx="6" fill="#FFFFFF" stroke="#826C2B" stroke-width="1.8" filter="url(#sombra-veiculo)" />
    <text x="375" y="163" font-size="12" font-weight="900" fill="#826C2B" text-anchor="middle">6,4 METROS (21 PÉS)</text>
    <text x="375" y="179" font-size="10" font-weight="800" fill="#AB2328" text-anchor="middle">TEMPO ESTIMADO: ~1,5s A 1,7s</text>
  </g>

  <!-- VETOR DE ARRANCADA DO AGRESSOR (LINHA RETA) -->
  <g id="vetor-ataque">
    <line x1="170" y1="280" x2="550" y2="280" stroke="#AB2328" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#seta-vermelha)" />
    <!-- Faixa de Alerta da Linha de Ataque -->
    <rect x="230" y="286" width="230" height="20" rx="3" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1" />
    <text x="345" y="300" font-size="10" font-weight="800" fill="#991B1B" text-anchor="middle">VETOR CINÉTICO RETILÍNEO (INÉRCIA FRONTAL)</text>
  </g>

  <!-- AGRESSOR EM ARRANCADA (TOP-DOWN REALISTA) -->
  <g id="agressor" transform="translate(140, 255)" filter="url(#sombra-operador)">
    <!-- Braço com Faca -->
    <path d="M 12,12 C 24,8 38,12 50,18" stroke="#475569" stroke-width="7" stroke-linecap="round" fill="none" />
    <circle cx="51" cy="18" r="4.5" fill="#F59E0B" />
    <!-- Faca / Lâmina Metálica -->
    <polygon points="52,16 70,12 56,22" fill="#E2E8F0" stroke="#475569" stroke-width="1" />
    <line x1="53" y1="17" x2="69" y2="13" stroke="#FFFFFF" stroke-width="1.2" />
    <!-- Braço Esquerdo -->
    <path d="M 12,38 C 20,44 28,46 36,42" stroke="#475569" stroke-width="7" stroke-linecap="round" fill="none" />
    <circle cx="36" cy="42" r="4.5" fill="#F59E0B" />
    <!-- Ombros e Torso Civil -->
    <ellipse cx="10" cy="25" rx="15" ry="20" fill="#7F1D1D" stroke="#AB2328" stroke-width="2" />
    <circle cx="9" cy="25" r="8" fill="#1E293B" />
    <!-- Rótulo Agressor -->
    <rect x="-42" y="48" width="144" height="20" rx="4" fill="#AB2328" />
    <text x="30" y="62" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">AGRESSOR COM FACA</text>
  </g>

  <!-- PONTO CRÍTICO: "O X" (POSIÇÃO ESTÁTICA / ERRO CRÍTICO FATAL) -->
  <g id="ponto-x" transform="translate(570, 255)">
    <!-- Zona de Perigo Vermelha -->
    <circle cx="20" cy="25" r="28" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" stroke-dasharray="4,4" />
    <!-- Cruz do X -->
    <line x1="6" y1="11" x2="34" y2="39" stroke="#DC2626" stroke-width="5" stroke-linecap="round" />
    <line x1="34" y1="11" x2="6" y2="39" stroke="#DC2626" stroke-width="5" stroke-linecap="round" />
    <!-- Aviso de Vulnerabilidade -->
    <rect x="-40" y="58" width="124" height="34" rx="4" fill="#7F1D1D" />
    <text x="22" y="72" font-size="9.5" font-weight="900" fill="#FEF08A" text-anchor="middle">PERMANECER NO "X"</text>
    <text x="22" y="85" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Saque estático: GOLPEADO!</text>

    <!-- Seta de Recuo Linear (Erro Fatal) -->
    <line x1="48" y1="25" x2="95" y2="25" stroke="#DC2626" stroke-width="3" stroke-dasharray="4,3" marker-end="url(#seta-vermelha)" />
    <text x="95" y="15" font-size="8.5" font-weight="800" fill="#DC2626">Recuo linear (Fatal!)</text>
  </g>

  <!-- MANOBRA ANGULAR: "SAIA DO X" (EVASÃO A 45°) -->
  <g id="manobra-saia-do-x">
    <!-- Seta Curva/Diagonal de Evasão a 45° -->
    <path d="M 570,260 Q 560,330 520,360" fill="none" stroke="#187731" stroke-width="4.5" stroke-linecap="round" marker-end="url(#seta-verde)" />
    
    <!-- Badge da Evasão -->
    <rect x="525" y="305" width="125" height="26" rx="4" fill="#187731" filter="url(#sombra-veiculo)" />
    <text x="587" y="322" font-size="10.5" font-weight="900" fill="#FFFFFF" text-anchor="middle">SAIA DO X (45°)</text>

    <!-- OPERADOR PMMG NA POSIÇÃO EVADIDA (ANATÔMICO REALISTA) -->
    <g id="operador-pm-posicionado" transform="translate(480, 360) rotate(-40)" filter="url(#sombra-operador)">
      <!-- Cone de Visada Defensiva Dinâmica apontando para o Agressor -->
      <path d="M 46,25 L 240,-15 L 240,65 Z" fill="url(#cone-visao-v1)" opacity="0.9" />
      <line x1="46" y1="25" x2="230" y2="25" stroke="#187731" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#seta-verde)" />

      <!-- Braços em Empunhadura Dupla (Triângulo Isósceles) -->
      <path d="M 12,9 C 20,8 30,14 42,21" stroke="#A08F63" stroke-width="7" stroke-linecap="round" fill="none" />
      <path d="M 12,41 C 20,42 30,36 42,29" stroke="#A08F63" stroke-width="7" stroke-linecap="round" fill="none" />
      <!-- Mãos e Luvas Pretas -->
      <circle cx="43" cy="23" r="4.5" fill="#111827" />
      <circle cx="43" cy="27" r="4.5" fill="#111827" />
      <!-- Pistola da PMMG -->
      <rect x="42" y="22.5" width="14" height="5" rx="1.5" fill="#1F2937" stroke="#000000" stroke-width="0.8" />

      <!-- Ombros Anatômicos (Farda Cáqui PMMG) -->
      <ellipse cx="10" cy="25" rx="14" ry="20" fill="#A08F63" stroke="#826C2B" stroke-width="1.5" />
      <!-- Colete Balístico Modular Preto -->
      <rect x="0" y="11" width="18" height="28" rx="4" fill="#111827" stroke="#374151" stroke-width="1.2" />
      <line x1="5" y1="16" x2="15" y2="16" stroke="#374151" stroke-width="1" />
      <line x1="5" y1="21" x2="15" y2="21" stroke="#374151" stroke-width="1" />
      <line x1="5" y1="26" x2="15" y2="26" stroke="#374151" stroke-width="1" />

      <!-- Cabeça com Boné Cáqui e Aba Frontal -->
      <circle cx="9" cy="25" r="7.5" fill="#826C2B" />
      <path d="M 14,20 C 18,22 18,28 14,30 Z" fill="#A08F63" stroke="#826C2B" stroke-width="1" />

      <!-- Identificador do Policial Militar -->
      <rect x="-35" y="44" width="110" height="20" rx="3" fill="#0F172A" opacity="0.95" />
      <text x="20" y="58" font-size="9" font-weight="900" fill="#4ADE80" text-anchor="middle">PM EM EVASÃO ANGULAR</text>
    </g>
  </g>

  <!-- GANHO TEMPORAL E RECALCULO DE VETOR PELO AGRESSOR -->
  <g id="vetor-reorientacao">
    <path d="M 280,280 Q 380,310 470,365" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="6,4" />
    <text x="380" y="340" font-size="9.5" font-weight="800" fill="#B45309">Agressor forçado a desacelerar e corrigir curva (+0,8s a 1,2s)</text>
  </g>

  <!-- Rodapé Técnico com Parâmetros Doutrinários Oficiais -->
  <rect x="0" y="480" width="860" height="40" fill="#0F172A" />
  <text x="20" y="498" font-size="11" font-weight="700" fill="#E2E8F0">DIRETRIZ TÁTICA: O recuo linear é fatal. A quebra angular a 45° força a desaceleração biomecânica do atacante e compra tempo reacionário vital para enquadramento e abrigo.</text>
  <text x="20" y="511" font-size="9.5" font-weight="600" fill="#94A3B8">Fontes: Dennis Tueller (1983) • Force Science Institute • MTP 3.04.01/2020-CG (Intervenção Policial e Uso da Força)</text>
</svg>