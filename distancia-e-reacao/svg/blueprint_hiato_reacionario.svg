<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="auto" style="background:#0D223A; border-radius:8px; border:2px solid #205487; font-family:'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Grid Blueprint Pequeno (20x20) -->
    <pattern id="grid-pequeno" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#16395C" stroke-width="0.8" />
    </pattern>

    <!-- Grid Blueprint Grande (100x100) -->
    <pattern id="grid-grande" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid-pequeno)" />
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#225382" stroke-width="1.6" />
    </pattern>

    <!-- Marcadores de Cota Técnica Blueprint -->
    <marker id="seta-blueprint" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#38BDF8" />
    </marker>
    <marker id="seta-alerta" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#F87171" />
    </marker>
    <marker id="seta-verde" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#4ADE80" />
    </marker>
  </defs>

  <!-- Fundo de Prancheta Blueprint com Malha Ortogonal -->
  <rect width="1920" height="1080" fill="#0A1D33" />
  <rect width="1920" height="1080" fill="url(#grid-grande)" />

  <!-- Borda Dupla Externa de Desenho Técnico -->
  <rect x="25" y="25" width="1870" height="1030" fill="none" stroke="#38BDF8" stroke-width="2" />
  <rect x="33" y="33" width="1854" height="1014" fill="none" stroke="#1E4E79" stroke-width="1" stroke-dasharray="8,4" />

  <!-- CABEÇALHO TÉCNICO BLUEPRINT -->
  <g id="cabecalho-tecnico">
    <rect x="50" y="50" width="1820" height="75" fill="#0D2744" stroke="#38BDF8" stroke-width="1.5" />
    <!-- Título Principal em Tipografia Técnica -->
    <text x="75" y="85" font-size="22" font-weight="900" fill="#38BDF8" letter-spacing="2">ESQUEMA TÉCNICO BIOMECÂNICO: O HIATO REACIONÁRIO NO CONFRONTO ARMADO</text>
    <text x="75" y="110" font-size="14" font-weight="700" fill="#93C5FD" letter-spacing="1">DESFASAGEM TEMPORAL ENTRE A INICIATIVA DA AMEAÇA E A RESPOSTA DEFENSIVA POLICIAL MILITAR</text>
    
    <!-- Metadados de Engenharia no Canto Superior Direito -->
    <text x="1845" y="82" font-size="12" font-weight="800" fill="#38BDF8" text-anchor="end" letter-spacing="1">DOC REF: MTP 3.04.01-CG</text>
    <text x="1845" y="105" font-size="11" font-weight="700" fill="#93C5FD" text-anchor="end">PADRÃO: CTP / PMMG 2026</text>
  </g>

  <!-- SEÇÃO 1: LINHA DA AÇÃO (AGRESSOR) -->
  <g id="linha-acao" transform="translate(50, 155)">
    <!-- Painel de Contorno Técnico -->
    <rect x="0" y="0" width="1820" height="185" fill="#102E4E" stroke="#F87171" stroke-width="1.8" />
    
    <!-- Faixa de Identificação -->
    <rect x="0" y="0" width="360" height="36" fill="#7F1D1D" stroke="#EF4444" stroke-width="1" />
    <text x="18" y="24" font-size="15" font-weight="900" fill="#FFFFFF" letter-spacing="1">AGRESSOR • AÇÃO (INICIATIVA)</text>

    <!-- Parâmetros de Partida -->
    <text x="25" y="68" font-size="17" font-weight="800" fill="#FCA5A5">INÍCIO DA CONDUTA: DECISÃO PRÉVIA E SURPRESA TÁTICA</text>
    <text x="25" y="96" font-size="14" font-weight="600" fill="#E2E8F0">Tempo de disparo motor: <tspan font-weight="900" fill="#EF4444">0,00 segundo</tspan> • Arrancada frontal com arma branca em direção ao policial</text>
    <text x="25" y="122" font-size="14" font-weight="600" fill="#CBD5E1">Velocidade média de corrida: <tspan font-weight="800" fill="#FBBF24">v ≈ 4,3 a 4,8 m/s</tspan> (~16 km/h) • Inércia frontal retilínea acelerada</text>

    <!-- Régua de Cota Balística Superior -->
    <g transform="translate(25, 145)">
      <line x1="0" y1="10" x2="1770" y2="10" stroke="#EF4444" stroke-width="3" stroke-dasharray="10,6" marker-end="url(#seta-alerta)" />
      <!-- Marcas de Metragem -->
      <line x1="0" y1="0" x2="0" y2="20" stroke="#EF4444" stroke-width="2" />
      <text x="0" y="32" font-size="12" font-weight="800" fill="#EF4444" text-anchor="middle">0,0m (T=0,0s)</text>

      <line x1="380" y1="0" x2="380" y2="20" stroke="#FCA5A5" stroke-width="1.5" />
      <text x="380" y="32" font-size="12" font-weight="800" fill="#FCA5A5" text-anchor="middle">~2,2m (T=0,5s)</text>

      <line x1="760" y1="0" x2="760" y2="20" stroke="#FCA5A5" stroke-width="1.5" />
      <text x="760" y="32" font-size="12" font-weight="800" fill="#FCA5A5" text-anchor="middle">~4,5m (T=1,0s)</text>

      <line x1="1140" y1="0" x2="1140" y2="20" stroke="#EF4444" stroke-width="2" />
      <text x="1140" y="32" font-size="13" font-weight="900" fill="#EF4444" text-anchor="middle">6,4m / 21 PÉS (T ≈ 1,5s)</text>
    </g>
  </g>

  <!-- SEÇÃO 2: A ZONA DE DEFASAGEM TÉCNICA (O HIATO REACIONÁRIO) -->
  <g id="zona-hiato" transform="translate(50, 365)">
    <rect x="0" y="0" width="1820" height="100" fill="#13385C" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6,4" />
    
    <!-- Faixa Central do Hiato -->
    <rect x="25" y="16" width="310" height="30" fill="#0369A1" stroke="#38BDF8" stroke-width="1" />
    <text x="38" y="37" font-size="14" font-weight="900" fill="#FFFFFF" letter-spacing="1">HIATO REACIONÁRIO: Δt ≈ 1,30s a 1,60s</text>

    <!-- Parâmetro Central -->
    <text x="360" y="38" font-size="17" font-weight="800" fill="#38BDF8">LATÊNCIA BIOLÓGICA COMPULSÓRIA DO POLICIAL</text>
    <text x="25" y="75" font-size="14.5" font-weight="600" fill="#E0F2FE">
      Enquanto o militar processa visualmente a investida, certifica o risco letal e comanda a resposta motora, 
      <tspan font-weight="900" fill="#F87171">o agressor já consumiu de 5 a 6 metros do espaço de segurança</tspan>.
    </text>
  </g>

  <!-- SEÇÃO 3: LINHA DA REAÇÃO (POLICIAL MILITAR - CICLO NEUROLÓGICO) -->
  <g id="linha-reacao" transform="translate(50, 490)">
    <rect x="0" y="0" width="1820" height="280" fill="#0E2845" stroke="#38BDF8" stroke-width="1.8" />
    
    <!-- Faixa Policial Militar -->
    <rect x="0" y="0" width="360" height="36" fill="#1E3A8A" stroke="#38BDF8" stroke-width="1" />
    <text x="18" y="24" font-size="15" font-weight="900" fill="#FFFFFF" letter-spacing="1">POLICIAL MILITAR • REAÇÃO DEFENSIVA</text>

    <text x="25" y="65" font-size="16" font-weight="800" fill="#93C5FD">FASES DO CICLO NEURAL E MOTOR SOB ESTRESSE DE COMBATE (MTP 3.04.01):</text>

    <!-- 3 MÓDULOS DE PROCESSO TÉCNICO CAD -->
    <!-- MÓDULO 1: IDENTIFICAR / PERCEPÇÃO -->
    <g transform="translate(25, 85)">
      <rect x="0" y="0" width="370" height="150" fill="#0B2038" stroke="#38BDF8" stroke-width="1.5" />
      <rect x="0" y="0" width="370" height="30" fill="#1E40AF" />
      <text x="14" y="21" font-size="14" font-weight="900" fill="#FFFFFF">1. IDENTIFICAR (PERCEPÇÃO VISUAL)</text>

      <text x="15" y="58" font-size="14" font-weight="700" fill="#38BDF8">TEMPO NEURAL: Δt ≈ 0,20s a 0,30s</text>
      <text x="15" y="85" font-size="13" font-weight="600" fill="#CBD5E1">Captação óptica da lâmina ou movimento hostil.</text>
      <text x="15" y="108" font-size="13" font-weight="600" fill="#CBD5E1">Foco ocular ('Quiet Eye') e transmissão retiniana.</text>
      <text x="15" y="132" font-size="12" font-weight="800" fill="#94A3B8">↳ Distância consumida pelo alvo: ~1,2m</text>
    </g>

    <!-- Seta Conectora 1 -> 2 -->
    <line x1="405" y1="160" x2="435" y2="160" stroke="#38BDF8" stroke-width="3" marker-end="url(#seta-blueprint)" />

    <!-- MÓDULO 2: CERTIFICAR / DECIDIR -->
    <g transform="translate(445, 85)">
      <rect x="0" y="0" width="370" height="150" fill="#0B2038" stroke="#38BDF8" stroke-width="1.5" />
      <rect x="0" y="0" width="370" height="30" fill="#1E40AF" />
      <text x="14" y="21" font-size="14" font-weight="900" fill="#FFFFFF">2. CERTIFICAR &amp; DECIDIR (CÓRTEX)</text>

      <text x="15" y="58" font-size="14" font-weight="700" fill="#FBBF24">TEMPO COGNITIVO: Δt ≈ 0,35s a 0,50s</text>
      <text x="15" y="85" font-size="13" font-weight="600" fill="#CBD5E1">Processamento de risco letal no córtex pré-frontal.</text>
      <text x="15" y="108" font-size="13" font-weight="600" fill="#CBD5E1">Seleção de resposta: quebra angular e saque.</text>
      <text x="15" y="132" font-size="12" font-weight="800" fill="#94A3B8">↳ Distância acumulada pelo alvo: ~3,5m</text>
    </g>

    <!-- Seta Conectora 2 -> 3 -->
    <line x1="825" y1="160" x2="855" y2="160" stroke="#38BDF8" stroke-width="3" marker-end="url(#seta-blueprint)" />

    <!-- MÓDULO 3: AGIR / RESPOSTA MOTORA -->
    <g transform="translate(865, 85)">
      <rect x="0" y="0" width="410" height="150" fill="#0B2038" stroke="#4ADE80" stroke-width="1.8" />
      <rect x="0" y="0" width="410" height="30" fill="#15803D" />
      <text x="14" y="21" font-size="14" font-weight="900" fill="#FFFFFF">3. AGIR (RESPOSTA MOTORA / SAQUE)</text>

      <text x="15" y="58" font-size="14" font-weight="700" fill="#4ADE80">TEMPO BIOMECÂNICO: Δt ≈ 0,60s a 0,80s</text>
      <text x="15" y="85" font-size="13" font-weight="600" fill="#CBD5E1">Liberação de trava de retenção (Nível II/III Bélica/Safariland).</text>
      <text x="15" y="108" font-size="13" font-weight="600" fill="#CBD5E1">Evasão lateral a 45° ('Saia do X') e visada.</text>
      <text x="15" y="132" font-size="12" font-weight="800" fill="#4ADE80">↳ Distância final de impacto se estático: &gt; 6,0m</text>
    </g>

    <!-- MÓDULO 4: SÍNTESE DOUTRINÁRIA DE SOBREVIVÊNCIA -->
    <g transform="translate(1290, 85)">
      <rect x="0" y="0" width="460" height="150" fill="#162D4A" stroke="#FBBF24" stroke-width="1.8" />
      <rect x="0" y="0" width="460" height="30" fill="#854D0E" />
      <text x="14" y="21" font-size="13" font-weight="900" fill="#FEF08A">REGRA TÁTICA DE OURO</text>

      <text x="15" y="55" font-size="13" font-weight="800" fill="#FEF08A">NÃO FIQUE NO "X":</text>
      <text x="15" y="78" font-size="12.5" font-weight="600" fill="#FFFFFF">Recuo de ré = Fatalidade.</text>
      <text x="15" y="100" font-size="12.5" font-weight="600" fill="#FFFFFF">Deslocamento a 45° quebra</text>
      <text x="15" y="122" font-size="12.5" font-weight="600" fill="#FFFFFF">a inércia e compra +1,0s.</text>
    </g>
  </g>

  <!-- CARIMBO TÉCNICO OFICIAL DE PRANCHETA CAD PMMG (CANTO INFERIOR DIREITO) -->
  <g id="carimbo-blueprint" transform="translate(1400, 910)">
    <rect x="0" y="0" width="470" height="120" fill="#08182B" stroke="#38BDF8" stroke-width="1.8" />
    <!-- Título do Carimbo -->
    <rect x="0" y="0" width="470" height="26" fill="#0C345B" />
    <text x="235" y="18" font-size="12" font-weight="900" fill="#38BDF8" text-anchor="middle" letter-spacing="1">POLÍCIA MILITAR DE MINAS GERAIS • CTP</text>

    <!-- Linhas Divisórias da Matriz -->
    <line x1="0" y1="60" x2="470" y2="60" stroke="#1E4E79" stroke-width="1" />
    <line x1="235" y1="26" x2="235" y2="120" stroke="#1E4E79" stroke-width="1" />

    <!-- Quadrante 1 -->
    <text x="14" y="44" font-size="10" font-weight="700" fill="#93C5FD">PROJETO:</text>
    <text x="75" y="44" font-size="11" font-weight="900" fill="#FFFFFF">DENTRO DO CONFRONTO (MÓDULO 04)</text>

    <!-- Quadrante 2 -->
    <text x="250" y="44" font-size="10" font-weight="700" fill="#93C5FD">ASSUNTO:</text>
    <text x="315" y="44" font-size="11" font-weight="900" fill="#FFFFFF">HIATO REACIONÁRIO &amp; TUELLER</text>

    <!-- Quadrante 3 -->
    <text x="14" y="80" font-size="10" font-weight="700" fill="#93C5FD">FONTE TÉCNICA:</text>
    <text x="14" y="100" font-size="11" font-weight="800" fill="#E2E8F0">MTP 3.04.01 • FSI 2018 • TUELLER 1983</text>

    <!-- Quadrante 4 -->
    <text x="250" y="80" font-size="10" font-weight="700" fill="#93C5FD">ESCALA &amp; APROVAÇÃO:</text>
    <text x="250" y="100" font-size="11" font-weight="800" fill="#4ADE80">1:1 TEMPO/ESPAÇO • VALIDADO CTP</text>
  </g>
</svg>