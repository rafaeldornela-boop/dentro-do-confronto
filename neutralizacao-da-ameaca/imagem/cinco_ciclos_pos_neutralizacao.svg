<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" rx="12" fill="#0F172A"/>
  <text x="400" y="38" fill="#B89053" font-family="system-ui, sans-serif" font-size="19" font-weight="800" text-anchor="middle">PROTOCOLO DOS 5 CICLOS IMEDIATOS PÓS-NEUTRALIZAÇÃO</text>
  <text x="400" y="60" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Transição Tática, Abrigo, Desescalada, Segurança Periférica e Legalidade (MTP 01/02)</text>

  <!-- Ciclo 1 -->
  <g transform="translate(30, 95)">
    <rect width="135" height="230" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
    <rect width="135" height="38" rx="8" fill="#991B1B"/>
    <text x="67" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">1. ENGAJAR &amp; ABRIGO</text>
    <text x="67" y="65" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">FOLLOW-THROUGH</text>
    <text x="12" y="95" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Dedo na armação</text>
    <text x="12" y="115" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Tomada de abrigo</text>
    <text x="12" y="135" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Desescalada / Voz</text>
    <text x="12" y="155" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Confirma colapso</text>
    <rect x="10" y="185" width="115" height="30" rx="4" fill="#7F1D1D"/>
    <text x="67" y="205" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Cessou, abrigue-se</text>
  </g>

  <!-- Ciclo 2 -->
  <g transform="translate(180, 95)">
    <rect width="135" height="230" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="135" height="38" rx="8" fill="#B45309"/>
    <text x="67" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">2. ESCANEAR</text>
    <text x="67" y="65" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">VARREDURA 360°</text>
    <text x="12" y="95" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Quebra visão túnel</text>
    <text x="12" y="115" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Busca comparsas</text>
    <text x="12" y="135" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Checa janelas/flanco</text>
    <text x="12" y="155" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Controle populares</text>
    <rect x="10" y="185" width="115" height="30" rx="4" fill="#92400E"/>
    <text x="67" y="205" fill="#FEF3C7" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Alvo não é cenário</text>
  </g>

  <!-- Ciclo 3 -->
  <g transform="translate(330, 95)">
    <rect width="135" height="230" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
    <rect width="135" height="38" rx="8" fill="#1D4ED8"/>
    <text x="67" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">3. ESTABILIZAR</text>
    <text x="67" y="65" fill="#BFDBFE" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">CANGA CHECK</text>
    <text x="12" y="95" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Respiração 4x4x4x4</text>
    <text x="12" y="115" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Autoinspeção física</text>
    <text x="12" y="135" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• "Canga, foi atingido?"</text>
    <text x="12" y="155" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Recarga em abrigo</text>
    <rect x="10" y="185" width="115" height="30" rx="4" fill="#1E40AF"/>
    <text x="67" y="205" fill="#DBEAFE" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Calibra o sistema</text>
  </g>

  <!-- Ciclo 4 -->
  <g transform="translate(480, 95)">
    <rect width="135" height="230" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <rect width="135" height="38" rx="8" fill="#047857"/>
    <text x="67" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">4. CUSTODIAR</text>
    <text x="67" y="65" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">APROXIMAÇÃO</text>
    <text x="12" y="95" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Desescalada verbal</text>
    <text x="12" y="115" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Contato x Cobertura</text>
    <text x="12" y="135" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Isola a arma de fogo</text>
    <text x="12" y="155" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Algema se justificada</text>
    <rect x="10" y="185" width="115" height="30" rx="4" fill="#065F46"/>
    <text x="67" y="205" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">SV 11 (PRF)</text>
  </g>

  <!-- Ciclo 5 -->
  <g transform="translate(630, 95)">
    <rect width="135" height="230" rx="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect width="135" height="38" rx="8" fill="#6D28D9"/>
    <text x="67" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">5. PROCEDER</text>
    <text x="67" y="65" fill="#DDD6FE" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SOCORRO &amp; CPU</text>
    <text x="12" y="95" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• SAMU / Resgate</text>
    <text x="12" y="115" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• MARCH torniquete</text>
    <text x="12" y="135" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Anúncio CPU no rádio</text>
    <text x="12" y="155" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Isolamento &amp; RIUF</text>
    <rect x="10" y="185" width="115" height="30" rx="4" fill="#5B21B6"/>
    <text x="67" y="205" fill="#EDE9FE" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Cadeia de custódia</text>
  </g>

  <!-- Conectores -->
  <path d="M 165 210 L 180 210 M 315 210 L 330 210 M 465 210 L 480 210 M 615 210 L 630 210" stroke="#B89053" stroke-width="2"/>

  <!-- Rodapé -->
  <rect x="30" y="345" width="735" height="80" rx="8" fill="#1E293B" stroke="#B89053" stroke-width="1"/>
  <text x="400" y="372" fill="#B89053" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">REGRA DE OURO DA CONDUTA PÓS-NEUTRALIZAÇÃO</text>
  <text x="400" y="394" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">CESSOU O RISCO, CESSA O DISPARO ➔ DEDO NA ARMAÇÃO ➔ TOMADA DE ABRIGO</text>
  <text x="400" y="414" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">➔ DESESCALADA &amp; VARREDURA ➔ CANGA CHECK ➔ CUSTÓDIA (SV 11) ➔ SOCORRO &amp; CPU</text>
</svg>