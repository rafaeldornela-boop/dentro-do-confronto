<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="auto" style="background:#F8F9FA; border-radius:10px; border:1px solid #CBD5E1; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradientes dos Cones de Visão -->
    <radialGradient id="cone-contato" cx="0%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#B89053" stop-opacity="0.45" />
      <stop offset="65%" stop-color="#826C2B" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#826C2B" stop-opacity="0.0" />
    </radialGradient>

    <radialGradient id="setor-360" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1995FF" stop-opacity="0.22" />
      <stop offset="75%" stop-color="#1995FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1995FF" stop-opacity="0.0" />
    </radialGradient>

    <!-- Filtros de Sombra Suave -->
    <filter id="sombra-tática" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.22" />
    </filter>

    <!-- Marcadores de Setas -->
    <marker id="seta-caqui" markerWidth="7" markerHeight="7" refX="4" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#826C2B" />
    </marker>
    <marker id="seta-azul" markerWidth="7" markerHeight="7" refX="4" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#1995FF" />
    </marker>
  </defs>

  <!-- Faixa de Cabeçalho Institucional PMMG -->
  <rect x="0" y="0" width="900" height="42" fill="#826C2B" />
  <text x="20" y="26" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">POLÍCIA MILITAR DE MINAS GERAIS • GEOMETRIA TÁTICA DA CANGA</text>
  <text x="880" y="26" font-size="11" font-weight="700" fill="#F3EFE6" text-anchor="end">MTP 3.04.01/2020-CG / CTP</text>

  <!-- Área do Cenário de Intervenção -->
  <rect x="16" y="52" width="868" height="420" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Linhas Estruturais e Setores -->
  <line x1="16" y1="160" x2="884" y2="160" stroke="#F1F5F9" stroke-width="1.5" />
  <line x1="16" y1="310" x2="884" y2="310" stroke="#F1F5F9" stroke-width="1.5" />

  <!-- Viatura Policial SUV PMMG (Top-Down Realista) -->
  <g transform="translate(45, 185)" filter="url(#sombra-tática)">
    <!-- Rodas -->
    <rect x="15" y="-5" width="22" height="7" rx="2" fill="#1A1A1A" />
    <rect x="105" y="-5" width="22" height="7" rx="2" fill="#1A1A1A" />
    <rect x="15" y="68" width="22" height="7" rx="2" fill="#1A1A1A" />
    <rect x="105" y="68" width="22" height="7" rx="2" fill="#1A1A1A" />
    <!-- Carroceria SUV -->
    <path d="M 8,18 C 8,5 16,0 32,0 L 120,0 C 136,0 148,6 148,20 L 148,50 C 148,64 136,70 120,70 L 32,70 C 16,70 8,65 8,52 Z"
          fill="#F8FAFC" stroke="#826C2B" stroke-width="2.2" />
    <!-- Para-brisa Fumê -->
    <path d="M 38,7 C 34,7 32,10 30,35 C 32,60 34,63 38,63 L 48,59 C 45,48 45,22 48,11 Z" fill="#1E293B" opacity="0.85" />
    <!-- Teto com Faixa Institucional Cáqui -->
    <rect x="50" y="8" width="68" height="54" rx="3" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <rect x="50" y="23" width="68" height="24" fill="#826C2B" />
    <text x="84" y="39" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PMMG</text>
    <!-- Barra de Giroflex Aerodinâmica -->
    <rect x="68" y="15" width="12" height="40" rx="2" fill="#EF4444" />
    <rect x="74" y="15" width="6" height="40" fill="#3B82F6" />
    <text x="75" y="-12" font-size="9.5" font-weight="800" fill="#475569" text-anchor="middle">VIATURA (ABRIGO DO MOTOR)</text>
  </g>

  <!-- Setor de Varredura Periférica 360° da Cobertura -->
  <circle cx="340" cy="335" r="145" fill="url(#setor-360)" stroke="#1995FF" stroke-width="1.5" stroke-dasharray="5,4" />
  <text x="340" y="180" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="middle">VARREDURA PERIFÉRICA DA COBERTURA (FLANCOS E RETAGUARDA)</text>

  <!-- Cone de Foco Direcionado do Contato (Leitura da Ameaça e Mãos) -->
  <path d="M 375,175 L 670,110 L 690,240 Z" fill="url(#cone-contato)" />
  <line x1="375" y1="175" x2="675" y2="175" stroke="#826C2B" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#seta-caqui)" />

  <!-- Triângulo Tático de Abordagem (Linha Estrutural de Não Alinhamento) -->
  <polygon points="355,175 340,335 675,175" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3,3" />

  <!-- Indicação do Ângulo Defensivo -->
  <rect x="250" y="245" width="165" height="22" rx="4" fill="#F0FDF4" stroke="#16A34A" stroke-width="1" />
  <text x="332" y="260" font-size="9" font-weight="800" fill="#166534" text-anchor="middle">TRIÂNGULO: LINHA LIVRE DE FOGO</text>

  <!-- Cota Métrica: Distância de Reação -->
  <line x1="380" y1="130" x2="650" y2="130" stroke="#826C2B" stroke-width="1.4" stroke-dasharray="3,3" marker-start="url(#seta-caqui)" marker-end="url(#seta-caqui)" />
  <rect x="465" y="118" width="130" height="22" rx="4" fill="#FFFFFF" stroke="#826C2B" stroke-width="1" />
  <text x="530" y="133" font-size="9.5" font-weight="800" fill="#826C2B" text-anchor="middle">DISTÂNCIA: 3 A 5 METROS</text>

  <!-- OPERADOR 1: POLICIAL DE CONTATO -->
  <g transform="translate(355, 175)" filter="url(#sombra-tática)">
    <!-- Braços estendidos em empunhadura -->
    <path d="M 10,7 C 18,6 26,11 36,17" stroke="#A08F63" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 10,33 C 18,34 26,29 36,23" stroke="#A08F63" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="37" cy="18" r="4" fill="#111827" />
    <circle cx="37" cy="22" r="4" fill="#111827" />
    <rect x="36" y="18" width="12" height="4" rx="1" fill="#1F2937" stroke="#000000" stroke-width="0.5" />
    <!-- Ombros farda cáqui -->
    <ellipse cx="8" cy="20" rx="12" ry="16" fill="#A08F63" stroke="#826C2B" stroke-width="1.2" />
    <!-- Colete modular preto -->
    <rect x="0" y="9" width="15" height="22" rx="3" fill="#111827" stroke="#374151" stroke-width="1" />
    <!-- Cobertura cáqui -->
    <circle cx="7" cy="20" r="6" fill="#826C2B" />
    <path d="M 11,16 C 14,18 14,22 11,24 Z" fill="#A08F63" stroke="#826C2B" stroke-width="0.8" />
    <!-- Badge descritivo -->
    <rect x="-45" y="38" width="115" height="34" rx="4" fill="#1E293B" />
    <text x="12" y="52" font-size="9.5" font-weight="800" fill="#FDE047" text-anchor="middle">POLICIAL DE CONTATO</text>
    <text x="12" y="64" font-size="8.5" font-weight="500" fill="#E2E8F0" text-anchor="middle">Verbalização e Foco na Ameaça</text>
  </g>

  <!-- OPERADOR 2: POLICIAL DE COBERTURA -->
  <g transform="translate(340, 335) rotate(-20)" filter="url(#sombra-tática)">
    <!-- Arma em pronto-baixo -->
    <path d="M 10,7 C 16,6 22,10 30,15" stroke="#A08F63" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 10,33 C 16,34 22,30 30,25" stroke="#A08F63" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="31" cy="18" r="4" fill="#111827" />
    <circle cx="31" cy="22" r="4" fill="#111827" />
    <rect x="30" y="18" width="10" height="4" rx="1" fill="#1F2937" stroke="#000000" stroke-width="0.5" />
    <ellipse cx="8" cy="20" rx="12" ry="16" fill="#A08F63" stroke="#826C2B" stroke-width="1.2" />
    <rect x="0" y="9" width="15" height="22" rx="3" fill="#111827" stroke="#374151" stroke-width="1" />
    <circle cx="7" cy="20" r="6" fill="#826C2B" />
    <path d="M 11,16 C 14,18 14,22 11,24 Z" fill="#A08F63" stroke="#826C2B" stroke-width="0.8" />
    <!-- Badge descritivo -->
    <rect x="-45" y="38" width="118" height="34" rx="4" fill="#1E293B" />
    <text x="14" y="52" font-size="9.5" font-weight="800" fill="#93C5FD" text-anchor="middle">POLICIAL DE COBERTURA</text>
    <text x="14" y="64" font-size="8.5" font-weight="500" fill="#E2E8F0" text-anchor="middle">Segurança Perimétrica 360°</text>
  </g>

  <!-- INDIVÍDUO ABORDADO / SUSPEITO (Silhueta Anatômica Top-Down) -->
  <g transform="translate(675, 175)" filter="url(#sombra-tática)">
    <path d="M 10,8 C 16,10 20,14 24,18" stroke="#4B5563" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M 10,32 C 16,30 20,26 24,22" stroke="#4B5563" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Mãos destacadas -->
    <circle cx="25" cy="20" r="4.5" fill="#EF4444" stroke="#B91C1C" stroke-width="1" />
    <ellipse cx="8" cy="20" rx="12" ry="16" fill="#374151" stroke="#1F2937" stroke-width="1.2" />
    <circle cx="7" cy="20" r="6" fill="#1F2937" />
    <!-- Retículo de Alerta de Linha de Fogo / Mãos -->
    <circle cx="25" cy="20" r="12" fill="none" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="2,2" />
    <!-- Badge -->
    <rect x="-35" y="38" width="98" height="34" rx="4" fill="#7F1D1D" />
    <text x="14" y="52" font-size="9.5" font-weight="800" fill="#FECACA" text-anchor="middle">INDIVÍDUO ABORDADO</text>
    <text x="14" y="64" font-size="8.5" font-weight="500" fill="#FEE2E2" text-anchor="middle">Foco Crítico: Mãos e Cintura</text>
  </g>

  <!-- Rodapé Técnico Doutrinário -->
  <rect x="0" y="482" width="900" height="38" fill="#0F172A" />
  <text x="20" y="505" font-size="11" font-weight="600" fill="#94A3B8">PARÂMETRO TÁTICO: O Policial de Contato assume o diálogo e a busca física; o Policial de Cobertura preserva a visão periférica 360° para anular a visão em túnel da canga (MTP 01/02).</text>
</svg>
